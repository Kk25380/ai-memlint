<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ai-memlint</title>
<style>
:root{--a:#3b5bfd;--bg:#fbfbfd;--fg:#16181d;--mut:#6b7280;--ln:#e6e8ee;--ok:#0f9d58;--warn:#b45309;--bad:#c62828;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:22px 28px 14px;border-bottom:1px solid var(--ln);background:var(--card)}
h1{margin:0 0 10px;font-size:17px;letter-spacing:-.2px}
h1 span{color:var(--mut);font-weight:400;font-size:13px;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:3px 10px;border:1px solid var(--ln);border-radius:99px;font-size:12px;color:var(--mut);background:#fff}
.chip b{color:var(--fg);font-weight:600}
.chip.alert{border-color:#f3c9c9;background:#fdf5f5;color:var(--bad)} .chip.alert b{color:var(--bad)}
.chip.warn{border-color:#f0dcb8;background:#fdf9f0;color:var(--warn)} .chip.warn b{color:var(--warn)}
nav{display:flex;gap:2px;padding:0 28px;border-bottom:1px solid var(--ln);background:var(--card);align-items:center}
nav button[data-t]{appearance:none;border:0;background:0;padding:11px 15px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
nav button[data-t][aria-selected=true]{color:var(--a);border-bottom-color:var(--a);font-weight:600}
nav button[data-t]:disabled{color:#b9bdc7;cursor:not-allowed;border-bottom-color:transparent}
main{padding:22px 28px 60px;max-width:1320px}
.btn{appearance:none;border:1px solid var(--ln);background:#fff;border-radius:7px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--fg);margin:6px 0 6px 8px}
.btn:hover{border-color:var(--a);color:var(--a)}
.btn:disabled{cursor:wait;color:var(--a);border-color:#cbd3ff;background:#f3f5ff}
.btn.write{border-color:#f0dcb8;color:var(--warn)} .btn.write:hover{border-color:var(--warn)}
.scan-status{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 15px;border:1px solid #dce2ff;border-radius:10px;background:#f4f6ff;color:var(--a)}
.scan-status[hidden]{display:none}
.scan-copy{min-width:0;font-size:12px}
.scan-copy strong{display:block;font-size:13px;font-weight:600}
.scan-copy span{color:var(--mut)}
.probe-pulse{position:relative;flex:0 0 32px;width:32px;height:32px;border:1px solid currentColor;border-radius:50%}
.probe-pulse::before,.probe-pulse::after{content:"";position:absolute;inset:0;border:1px solid currentColor;border-radius:50%;opacity:0;transform:scale(.2)}
.probe-pulse i{position:absolute;inset:12px;border-radius:50%;background:currentColor}
.scan-status[data-state="scanning"] .probe-pulse::before{animation:probe-wave 1.8s cubic-bezier(.2,.6,.4,1) infinite}
.scan-status[data-state="scanning"] .probe-pulse::after{animation:probe-wave 1.8s cubic-bezier(.2,.6,.4,1) -.9s infinite}
.scan-status[data-state="success"]{color:var(--ok);border-color:#d4e9df;background:#f2f9f5}
.scan-status[data-state="error"]{color:var(--bad);border-color:#f3c9c9;background:#fdf5f5}
@keyframes probe-wave{0%{transform:scale(.2);opacity:.7}100%{transform:scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.scan-status[data-state="scanning"] .probe-pulse::before,.scan-status[data-state="scanning"] .probe-pulse::after{animation:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:11px;padding:14px 15px}
.card h3{margin:0 0 3px;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .fam{font-size:11px;color:var(--mut);margin-bottom:10px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-detected{background:#e8f5ee;color:var(--ok)} .b-empty{background:#eef1f7;color:var(--mut)} .b-none{background:#f4f4f6;color:#9aa0ab}
.stats{display:flex;gap:14px;margin:9px 0;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:16px;color:var(--fg);font-weight:600}
.roots{font-size:11px;color:var(--mut);font-family:ui-monospace,Consolas,monospace;word-break:break-all;border-top:1px solid var(--ln);padding-top:8px;margin-top:8px}
.note{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.5}
.sect{margin-top:26px} .sect:first-child{margin-top:0} .sect h2{font-size:13px;margin:0 0 4px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.sect .why{font-size:11.5px;color:var(--mut);margin:0 0 10px}
.rows{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.row{padding:9px 13px;border-bottom:1px solid var(--ln);font-size:12.5px;display:flex;gap:10px;align-items:baseline}
.row:last-child{border-bottom:0}
.row code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--a);word-break:break-all}
.tag{font-size:10.5px;padding:1px 7px;border-radius:4px;background:#eef1f7;color:var(--mut);white-space:nowrap}
.tag.w{background:#fdf3e2;color:var(--warn)} .tag.b{background:#fdeaea;color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;align-items:start}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
input,select{font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--ln);border-radius:7px;background:#fff;color:var(--fg)}
input[type=search]{flex:1;min-width:150px}
input:focus,select:focus{outline:0;border-color:var(--a)}
.nlist{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;max-height:70vh;overflow-y:auto}
.nitem{padding:9px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
.nitem:hover{background:#f7f8fc} .nitem[aria-current=true]{background:#eef1fe;border-left:3px solid var(--a);padding-left:10px}
.nitem .t{font-size:13px;font-weight:500} .nitem .m{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap}
.reader{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;min-height:220px}
.reader h3{margin:0 0 4px;font-size:15px} .reader .meta{font-size:11.5px;color:var(--mut);margin-bottom:13px;display:flex;gap:8px;flex-wrap:wrap}
.reader .body{margin:0;padding-top:12px;border-top:1px solid var(--ln);font:12.5px/1.75 ui-monospace,Consolas,"Microsoft YaHei",monospace}
.ln{display:flex;gap:10px;padding:0 4px;border-radius:3px}
.ln .no{flex:0 0 3.5ch;text-align:right;color:#c3c8d2;user-select:none;font-size:11px;line-height:1.9}
.ln .tx{white-space:pre-wrap;word-break:break-word;min-width:0;flex:1}
.ln .mk{display:inline-block;margin-left:8px;vertical-align:1px;font-size:10px;color:var(--warn);background:#fdf3e2;border-radius:4px;padding:0 6px;white-space:nowrap}
.ln.hit{background:#fdf9f0} .ln.hit .no{color:var(--warn);font-weight:700}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.opt{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px;font-size:12px;color:var(--mut);line-height:1.7}
.opt input{margin:4px 0 0;flex:0 0 auto}
.cform{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px} .cform input{flex:1 1 160px;min-width:130px}
.banner{padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:12px}
.banner.w{background:#fdf9f0;color:var(--warn);border:1px solid #f0dcb8}
.banner.b{background:#fdf5f5;color:var(--bad);border:1px solid #f3c9c9}
.empty{color:var(--mut);font-size:12.5px;padding:26px;text-align:center}

.frow{align-items:flex-start}
.sev{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-top:1px}
.s-high{background:#fdeaea;color:var(--bad)} .s-medium{background:#fdf3e2;color:var(--warn)}
.s-low{background:#e9f4f7;color:#0e7490} .s-info{background:#eef1f7;color:var(--mut)}
.fbody{min-width:0;flex:1}
.ft{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-weight:500}
.ft .k{font-size:10.5px;font-weight:400}
.floc{font-size:11px;color:var(--mut);margin-top:1px}
.fsub{display:block;margin-top:3px}
.ffix{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.55}
.fpath{font-size:11px;color:#9aa0ab;font-family:ui-monospace,Consolas,monospace;word-break:break-all;margin-top:2px}
.allok{background:var(--card);border:1px solid #d4e9df;border-radius:11px;padding:22px;text-align:center;color:var(--ok);font-size:14px}
.allok small{display:block;color:var(--mut);font-size:11.5px;margin-top:5px}
.gate{background:var(--card);border:1px solid var(--ln);border-radius:11px;padding:20px 22px;max-width:640px}
.gate h3{margin:0 0 6px;font-size:14px} .gate p{margin:0 0 6px;font-size:12.5px;color:var(--mut);line-height:1.65}
.ev{font-size:11px;color:#9aa0ab;font-family:ui-monospace,Consolas,monospace;padding:3px 13px;border-bottom:1px solid var(--ln);word-break:break-all}
.ev:last-child{border-bottom:0}

.sk{padding:9px 13px;border-bottom:1px solid var(--ln)}
.sk:last-child{border-bottom:0}
.sk .t{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-weight:500}
.sk .d{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.sk .d.w{color:var(--warn)}
.sk .p{font-size:11px;color:#9aa0ab;font-family:ui-monospace,Consolas,monospace;word-break:break-all;margin-top:3px}
.cmd{display:block;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:#f7f8fc;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;margin-top:6px;word-break:break-all;color:var(--fg);white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>ai-memlint <span id="sub">跨平台记忆审计器</span></h1>
  <div class="chips" id="chips"></div>
</header>
<!-- The inline text below is a fallback for opening this file directly, where no server
     injects the dictionary. When served, data-i18n overwrites it with the active locale. -->
<nav id="nav">
  <button data-t="find" aria-selected="true" data-i18n="web.nav.find">发现</button>
  <button data-t="plat" data-i18n="web.nav.plat">平台</button>
  <button data-t="skills" data-i18n="web.nav.skills">技能</button>
  <button data-t="notes" data-i18n="web.nav.notes">笔记</button>
  <button data-t="health" data-i18n="web.nav.health">体检</button>
  <span style="flex:1"></span>
  <button class="btn" id="rescan" data-i18n="web.rescan">重新扫描</button>
  <button class="btn write" id="materialize" hidden data-i18n="web.materialize">物化 store</button>
</nav>
<main>
  <div id="scan-status" class="scan-status" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="probe-pulse" aria-hidden="true"><i></i></span>
    <div class="scan-copy"><strong id="scan-title"></strong><span id="scan-detail"></span></div>
  </div>
  <section id="v-find"></section>
  <section id="v-plat" hidden></section>
  <section id="v-skills" hidden></section>
  <section id="v-notes" hidden></section>
  <section id="v-health" hidden></section>
</main>
<script>
const TOKEN='__TOKEN__';
// The server injects only the web.* slice of the active locale, so the page never carries
// strings in a language the CLI is not using. T() falls back to the key, which stays visible
// in the UI rather than rendering "undefined".
//
// Opened straight from disk there is no server to inject these, so both degrade instead of
// throwing: the page keeps its inline Chinese labels and shows the API error banner, which is
// far more useful than a blank screen caused by a ReferenceError before anything renders.
const L=(typeof __I18N__==='undefined')?{}:__I18N__;
const LOCALE_RAW='__LOCALE__';
// Validating the tag instead of comparing against the placeholder: the server replaces the
// placeholder textually, so a sentinel comparison would match after injection and always win.
const LOCALE=/^(zh|en)$/.test(LOCALE_RAW)?LOCALE_RAW:'en';
const MISSING=Object.keys(L).length===0;
const T=(k,v)=>{let s=L[k]??k;if(v)s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]===undefined?m:String(v[x]));return s};
const dateStr=(d)=>new Date(d).toLocaleString(LOCALE==='zh'?'zh-CN':'en-US');
const api=(p,o)=>fetch('/api/'+p+(p.includes('?')?'&':'?')+'t='+TOKEN,o).then(r=>r.json());
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const STAT={detected:['b-detected',T('web.stat.detected')],'detected-empty':['b-empty',T('web.stat.detectedEmpty')],
 'installed-no-memory':['b-none',T('web.stat.installedNoMemory')],'rules-only':['b-none',T('web.stat.rulesOnly')],'not-installed':['b-none',T('web.stat.notInstalled')]};
const SEV={high:T('web.sev.high'),medium:T('web.sev.medium'),low:T('web.sev.low'),info:T('web.sev.info')};
const KIND={security:T('web.kind.security'),correctness:T('web.kind.correctness'),hygiene:T('web.kind.hygiene'),descriptor:T('web.kind.descriptor')};
const BLAME=[['user-data',T('web.blame.user')],['descriptor',T('web.blame.descriptor')],['platform',T('web.blame.platform')]];
const BLAME_WHY={'user-data':T('web.why.user'),
 'descriptor':T('web.why.descriptor'),
 'platform':T('web.why.platform')};
// Only overwrite when a dictionary actually arrived; otherwise the inline fallback labels
// would be replaced by raw keys.
if(!MISSING)document.querySelectorAll('[data-i18n]').forEach(x=>{x.textContent=T(x.dataset.i18n)});
let D=null,V=null,SK=null,pendingOpen=null;
const BODY_OPT='aim.body.secret-value';

function chips(){
  const s=D.scanned,t=D.summary,c=document.getElementById('chips');c.replaceChildren();
  const add=(l,v,cls)=>{const x=el('div','chip'+(cls?' '+cls:''));x.append(l+' ',el('b',null,v));c.append(x)};
  add(T('web.chip.installed'),s.platformsInstalled); add(T('web.chip.withMemory'),s.platformsWithMemory);
  add(T('web.chip.notes'),s.notes); add(T('web.chip.roots'),s.rootsScanned);
  add(T('web.chip.findings'),t.total,t.bySeverity.high?'alert':t.total?'warn':'');
  add(T('web.chip.high'),t.bySeverity.high,t.bySeverity.high?'alert':'');
  add(T('web.chip.secret'),D.store.suppressed,D.store.suppressed?'alert':'');
  add('store',D.store.materialized?T('web.materialized'):T('web.notMaterialized'));
  document.getElementById('sub').textContent=T('web.scannedAt',{time:dateStr(D.scannedAt),ms:D.elapsedMs});
  document.getElementById('materialize').hidden=D.store.materialized;
  const nb=document.querySelector('#nav button[data-t=notes]');
  nb.disabled=!D.store.materialized;
  nb.title=D.store.materialized?'':T('web.storeTitle');
}

function findingRow(f){
  const r=el('div','row frow');
  r.append(el('span','sev s-'+f.severity,SEV[f.severity]));
  const b=el('div','fbody');
  const t=el('div','ft');t.append(el('span',null,f.title));
  if(f.count>1)t.append(el('span','tag','×'+f.count));
  t.append(el('span','tag k',KIND[f.kind]||f.kind));
  b.append(t);
  const loc=[f.platform,f.scope?(f.scope==='user'?T('web.scope.user'):(f.projectKey?T('web.scope.project',{key:f.projectKey}):f.scope)):null].filter(Boolean).join(' · ');
  if(loc)b.append(el('div','floc',loc));
  if(f.subject)b.append(el('code','fsub',f.subject));
  const marks=f.evidence?.marks||[];
  if(marks.length){
    const box=el('div','marks');
    marks.slice(0,6).forEach(mk=>box.append(el('span','tag w','L'+mk.line+' '+mk.rule)));
    if(marks.length>6)box.append(el('span','tag',T('web.moreLines',{n:marks.length-6})));
    b.append(box);
    if(D.store.materialized){
      const slug=(f.subject||'').replace(/\.md$/,'');
      const note=D.notes.find(x=>x.slug===slug&&x.scope===f.scope&&(x.projectKey||null)===(f.projectKey||null));
      if(note){
        const btn=el('button','btn',T('web.viewLine',{line:marks[0].line}));
        btn.style.margin='8px 0 0';
        btn.onclick=()=>{pendingOpen={slug:note.slug,scope:note.scope,projectKey:note.projectKey,line:marks[0].line};show('notes')};
        b.append(btn);
      }
    }
  }
  b.append(el('div','ffix','→ '+f.fix));
  if(f.path&&f.path!==f.subject)b.append(el('div','fpath',f.path));
  r.append(b);
  return r;
}

function vFind(){
  const v=document.getElementById('v-find');v.replaceChildren();
  const f=el('div','filters');
  const q=el('input');q.type='search';q.placeholder=T('web.search.findings');
  const fs=el('select');fs.append(new Option(T('web.allSeverity'),''));
  Object.keys(SEV).forEach(s=>fs.append(new Option(SEV[s]+' ('+s+')',s)));
  const fb=el('select');fb.append(new Option(T('web.allBlame'),''));
  BLAME.forEach(([b,l])=>fb.append(new Option(l.split(' — ')[0],b)));
  const fp=el('select');fp.append(new Option(T('web.allPlatform'),''));
  [...new Set(D.findings.map(x=>x.platform).filter(Boolean))].forEach(p=>fp.append(new Option(p,p)));
  f.append(q,fs,fb,fp);v.append(f);

  const host=el('div');v.append(host);
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const items=D.findings.filter(x=>(!fs.value||x.severity===fs.value)&&(!fb.value||x.blame===fb.value)
      &&(!fp.value||x.platform===fp.value)
      &&(!k||(x.title+' '+(x.subject||'')+' '+x.fix+' '+(x.platform||'')).toLowerCase().includes(k)));
    host.replaceChildren();
    if(!items.length){
      if(!D.findings.length){
        const ok=el('div','allok',T('web.clean.title'));
        ok.append(el('small',null,T('web.clean.detail',{roots:D.scanned.rootsScanned,shapes:D.scanned.shapeHits,notes:D.scanned.notes})));
        host.append(ok);
      }else host.append(el('div','empty',T('web.noMatchFindings')));
      return;
    }
    for(const [b,label] of BLAME){
      const g=items.filter(x=>x.blame===b);
      if(!g.length)continue;
      const s=el('div','sect');
      s.append(el('h2',null,label+' ('+g.length+')'));
      s.append(el('p','why',BLAME_WHY[b]));
      const r=el('div','rows');g.forEach(x=>r.append(findingRow(x)));
      s.append(r);host.append(s);
    }
  };
  [q,fs,fb,fp].forEach(x=>x.oninput=draw);draw();
}

async function postCustom(list,msg,ok){
  msg.textContent=T('web.saving');
  try{
    const r=await fetch('/api/custom?t='+TOKEN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platforms:list})});
    const j=await r.json();
    if(!r.ok){msg.textContent=T('web.saveFailed',{err:j.error||('HTTP '+r.status)});return;}
    msg.textContent='';
    if(ok)ok();
    D=j.overview||D;SK=null;chips();vPlat();
  }catch(e){msg.textContent=T('web.saveFailed',{err:e?.message||e});}
}

async function vPlat(){
  const v=document.getElementById('v-plat');v.replaceChildren();
  let CUST=[],CERR=null;
  try{const c=await api('custom');CUST=c.platforms||[];CERR=c.error||null;}catch{}
  const live=D.platforms.filter(p=>p.custom);
  const sect=el('div','sect');
  sect.append(el('h2',null,T('web.custom.heading',{n:CUST.length})));
  sect.append(el('div','note',T('web.custom.note')));
  if(CERR)sect.append(el('div','banner w',CERR));
  const rows=el('div','rows');
  for(const cu of CUST){
    const p=live.find(x=>x.id===cu.id);
    const x=el('div','row');
    x.append(el('span','tag w',T('web.custom.tag')),el('code',null,cu.label+'  ·  '+cu.roots.join(' , ')+(cu.memoryDir?' / '+cu.memoryDir:'')+(cu.index?'  ['+cu.index+']':'')));
    x.append(el('span','tag',p&&p.installed?T('web.custom.notes',{n:p.notes}):T('web.custom.missing')));
    const del=el('button','btn',T('web.custom.delete'));
    del.onclick=()=>postCustom(CUST.filter(y=>y.id!==cu.id),msg);
    x.append(del);
    rows.append(x);
  }
  if(!CUST.length)rows.append(el('div','empty',T('web.custom.empty')));
  sect.append(rows);
  const f=el('div','cform');
  const iL=el('input'),iR=el('input'),iM=el('input'),iI=el('input');
  iL.placeholder=T('web.custom.phLabel');
  iR.placeholder=T('web.custom.phRoot');
  iM.placeholder=T('web.custom.phMemory');
  iI.placeholder=T('web.custom.phIndex');
  const btn=el('button','btn',T('web.custom.add'));
  const msg=el('div','note');
  btn.onclick=()=>postCustom([...CUST,{label:iL.value,roots:iR.value,memoryDir:iM.value,index:iI.value}],msg,()=>{iL.value=iR.value=iM.value=iI.value='';});
  f.append(iL,iR,iM,iI,btn);
  sect.append(f,msg);
  v.append(sect);

async function openNote(n,pane,focusLine){
  pane.replaceChildren();
  pane.append(el('h3',null,n.slug));
  const m=el('div','meta');
  m.append(el('span','tag',n.platform),el('span','tag',n.scope==='user'?T('web.scope.user'):n.projectKey));
  if(n.type)m.append(el('span','tag',n.type));
  m.append(el('span',null,T('web.bytes',{n:n.bytes})));m.append(el('span',null,T('web.sources',{list:n.sources.join(', ')})));
  pane.append(m);
  if(n.description)pane.append(el('div','note',n.description));
  const r=await api('note?key='+encodeURIComponent(n.key)+(localStorage.getItem(BODY_OPT)==='1'?'&body=1':''));
  if(r.error){
    pane.append(el('div','banner '+(r.code===403?'b':'w'),r.error));
    if(r.meta?.marks?.length)pane.append(marksBlock(r.meta.marks,T('web.marksHeading')));
    else if(r.meta?.rules?.length)pane.append(el('div','note',T('web.rulesHit',{list:r.meta.rules.join(', ')})));
    (r.meta?.sources||[]).forEach(s=>pane.append(el('div','note',T('web.src',{p:(typeof s==='string'?s:s.srcPath)}))));
    if(r.code===403&&r.meta?.level==='secret-value')bodyOpt(n,pane,focusLine,localStorage.getItem(BODY_OPT)==='1');
    return;
  }
  if(r.live){pane.append(el('div','banner w',T('web.liveBanner',{from:r.meta?.liveFrom||T('web.sourceFile')})));bodyOpt(n,pane,focusLine,true);}
  else if(r.masked)pane.append(el('div','banner w',T('web.maskedBanner',{level:r.level,rules:r.rules.join(', ')})));
  renderBody(pane,r.text,r.marks,focusLine);
}

function bodyOpt(n,pane,focusLine,checked){
  const lab=el('label','opt');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=checked;
  cb.onchange=()=>{localStorage.setItem(BODY_OPT,cb.checked?'1':'0');openNote(n,pane,focusLine);};
  lab.append(cb,document.createTextNode(T('web.optIn')));
  pane.append(lab);
}

function marksBlock(marks,label){
  const w=el('div');
  if(label)w.append(el('div','note',label));
  const box=el('div','marks');
  marks.forEach(mk=>box.append(el('span','tag w','L'+mk.line+' '+mk.rule)));
  w.append(box);
  return w;
}

// Line numbers come from the source scan and stay valid here: mask() replaces matched
// substrings in place and never adds or removes a newline.
function renderBody(pane,text,marks,focusLine){
  const byLine=new Map();
  for(const mk of marks||[]){
    if(!byLine.has(mk.line))byLine.set(mk.line,new Set());
    byLine.get(mk.line).add(mk.rule);
  }
  const body=el('div','body');
  let focusEl=null;
  text.split('\n').forEach((ln,i)=>{
    const rules=byLine.get(i+1);
    const row=el('div','ln'+(rules?' hit':''));
    const tx=el('span','tx',ln);
    if(rules)tx.append(el('span','mk',[...rules].join(', ')));
    row.append(el('span','no',String(i+1)),tx);
    if(focusLine===i+1)focusEl=row;
    body.append(row);
  });
  pane.append(body);
  if(focusEl)focusEl.scrollIntoView({block:'center'});
}

const clip=(s,n)=>!s?'':s.length>n?s.slice(0,n-1)+'…':s;
const skGroup=(s)=>s.platform||(s.rel.split(/[\\/]/)[0]);

async function copyText(text,btn){
  const label=btn.textContent;
  const done=(ok)=>{btn.textContent=ok?T('web.sk.copied'):T('web.sk.copyFailed');setTimeout(()=>{btn.textContent=label},1400)};
  try{await navigator.clipboard.writeText(text);done(true)}catch{
    const ta=el('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.append(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch{}
    ta.remove();done(ok);
  }
}

const WORD={missing:[T('web.state.missing'),'w'],conflict:[T('web.state.conflict'),'b'],same:[T('web.state.same'),'']};

function drawReport(out,r){
  const head=el('div','card');
  const h=el('h3');
  h.append(el('span',null,T('web.sk.target',{label:r.target.label})));
  h.append(el('span','badge '+(r.counts.conflict?'b-none':r.counts.missing?'b-empty':'b-detected'),T('web.sk.missingBadge',{n:r.counts.missing})));
  head.append(h);
  head.append(el('div','fam',T('web.sk.fam',{rel:r.target.rel,n:r.target.skills,src:r.source?r.source.rel:T('web.sk.otherSources')})));
  const st=el('div','stats');
  for(const[l,n]of[[T('web.state.missing'),r.counts.missing],[T('web.state.same'),r.counts.same],[T('web.state.conflict'),r.counts.conflict],[T('web.sk.total'),r.counts.total]]){
    const d=el('div');d.append(el('b',null,n),document.createTextNode(l));st.append(d)}
  head.append(st);
  for(const p of r.prepare)head.append(el('code','cmd',p));
  head.append(el('div','note',r.note));
  out.append(head);

  const list=el('div','rows');
  const cmds=[];
  let g=null;
  for(const i of r.items){
    if(i.state!==g){g=i.state;list.append(el('div','ev',WORD[g][0]+' · '+r.items.filter(x=>x.state===g).length))}
    const d=el('div','sk');
    const t=el('div','t');
    t.append(el('span',null,i.name));
    t.append(el('span','tag '+WORD[i.state][1],WORD[i.state][0]));
    if(i.copies>1)t.append(el('span','tag',T('web.sk.copies',{n:i.copies})));
    t.append(el('span','tag',i.chosen.hash.slice(0,8)));
    d.append(t);
    d.append(el('div','p',T('web.sk.from',{rel:i.chosen.rel})+(i.current?T('web.sk.currentAtTarget',{hash:i.current.hash.slice(0,8)}):'')));
    for(const w of i.warnings)d.append(el('div','d w','⚠ '+w));
    if(i.command){
      d.append(el('code','cmd',i.command));cmds.push(i.command);
      const b=el('button','btn',T('web.sk.copy'));b.onclick=()=>copyText(i.command,b);d.append(b);
    }
    list.append(d);
  }
  if(!r.items.length)list.append(el('div','empty',T('web.sk.none')));
  out.append(list);
  if(cmds.length){
    const b=el('button','btn',T('web.sk.copyAll',{n:cmds.length}));
    b.onclick=()=>copyText([...r.prepare,...cmds].join('\n'),b);
    out.append(b);
  }
}

function drawSkills(v){
  v.replaceChildren();
  const labels=new Map((D?.platforms||[]).map(p=>[p.id,p.label]));
  const name=(k)=>labels.get(k)||k;
  const tLabel=(t)=>(t.platform?name(t.platform)+' · ':'')+t.rel+' ('+t.skills+')';

  const s1=el('div','sect');
  s1.append(el('h2',null,T('web.sk.reportTitle')));
  s1.append(el('div','note',T('web.sk.reportNote')));
  const bar=el('div','cform');
  const to=el('select'),from=el('select'),go=el('button','btn',T('web.sk.generate'));
  const out=el('div');
  to.append(new Option(T('web.sk.pickTarget'),''));
  for(const t of SK.targets.filter(x=>x.installable))to.append(new Option(tLabel(t),t.key));
  const fillFrom=()=>{
    const keep=from.value;
    from.replaceChildren(new Option(T('web.sk.allSources'),''));
    for(const t of SK.targets){
      if(t.key===to.value)continue;
      from.append(new Option((t.installable?'':T('web.sk.sourceOnly'))+tLabel(t),t.key));
    }
    if([...from.options].some(o=>o.value===keep))from.value=keep;
  };
  to.onchange=fillFrom;fillFrom();
  bar.append(to,from,go);
  s1.append(bar,out);
  v.append(s1);

  go.onclick=async()=>{
    if(!to.value){out.replaceChildren(el('div','banner w',T('web.sk.needTarget')));return}
    const label=go.textContent;go.disabled=true;go.textContent=T('web.scan.rescanRunning');
    out.replaceChildren(el('div','empty',T('web.sk.comparing')));
    try{
      const r=await api('skills?to='+encodeURIComponent(to.value)+(from.value?'&from='+encodeURIComponent(from.value):''));
      out.replaceChildren();
      if(r.error)out.append(el('div','banner b',r.error));
      else drawReport(out,r);
    }catch(e){out.replaceChildren(el('div','banner b',T('web.sk.failed',{err:e?.message||e})))}
    finally{go.disabled=false;go.textContent=label}
  };

  const dirty=SK.skills.filter(s=>s.level!=='clean');
  const s2=el('div','sect');
  s2.append(el('h2',null,T('web.sk.listTitle',{n:SK.count})));
  s2.append(el('div','note',T('web.sk.listNote')));
  if(dirty.length)s2.append(el('div','banner b',T('web.sk.dirty',{n:dirty.length,names:dirty.slice(0,6).map(s=>s.name).join(LOCALE==='zh'?'、':', ')})));
  const f=el('div','filters');
  const q=el('input');q.type='search';q.placeholder=T('web.sk.search');
  const fp=el('select');fp.append(new Option(T('web.sk.allPlaces'),''));
  for(const k of [...new Set(SK.skills.map(skGroup))].sort())fp.append(new Option(name(k),k));
  f.append(q,fp);s2.append(f);
  const list=el('div','nlist');s2.append(list);
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const items=SK.skills.filter(s=>(!fp.value||skGroup(s)===fp.value)
      &&(!k||(s.name+' '+(s.manifestName||'')+' '+(s.description||'')+' '+s.rel).toLowerCase().includes(k)));
    list.replaceChildren();
    if(!items.length){list.append(el('div','empty',T('web.noMatch')));return}
    let g=null;
    for(const s of items){
      const gk=skGroup(s);
      if(gk!==g){g=gk;list.append(el('div','ev',name(gk)+' · '+items.filter(x=>skGroup(x)===gk).length))}
      list.append(skillRow(s));
    }
  };
  [q,fp].forEach(x=>x.oninput=draw);draw();
  v.append(s2);
}

// One animation driver for both actions, so the pulse means the same thing either way.
async function withScan(button,label,running,fn){
  if(button.disabled)return;
  const status=document.getElementById('scan-status');
  const title=document.getElementById('scan-title');
  const detail=document.getElementById('scan-detail');
  const text=button.textContent;
  button.disabled=true;button.textContent=running;button.setAttribute('aria-busy','true');
  status.hidden=false;status.dataset.state='scanning';
  title.textContent=label;detail.textContent=T('web.scan.reading');
  try{
    const msg=await fn();
    D=await api('overview');chips();
    const t=document.querySelector('#nav button[aria-selected=true]').dataset.t;
    if(usable(t))views[t]();
    status.dataset.state='success';title.textContent=msg.title;detail.textContent=msg.detail;
  }catch{
    status.dataset.state='error';title.textContent=T('web.scan.incomplete');
    detail.textContent=T('web.scan.retry');
  }finally{
    button.disabled=false;button.textContent=text;button.removeAttribute('aria-busy');
  }
}

const rescanBtn=document.getElementById('rescan');
rescanBtn.onclick=()=>withScan(rescanBtn,T('web.scan.rescanLabel'),T('web.scan.rescanRunning'),async()=>{
  const d=await api('overview');
  SK=null;
  return {title:T('web.scan.done'),detail:T('web.scan.doneDetail',{total:d.summary.total,high:d.summary.bySeverity.high,platforms:d.scanned.platformsWithMemory,notes:d.scanned.notes})};
});

function materialize(button){
  return withScan(button,T('web.scan.materializing'),T('web.scan.writing'),async()=>{
    const r=await fetch('/api/harvest?t='+TOKEN,{method:'POST'});
    if(!r.ok)throw new Error(T('web.err.harvestRequest'));
    const j=await r.json();
    if(j.harvest?.code!==0)throw new Error(T('web.err.harvestExit',{code:j.harvest?.code}));
    V=null;
    // harvest.mjs still prints in Chinese; only echo its summary line when the UI is Chinese,
    // otherwise the toast would mix languages.
    const line=LOCALE==='zh'?(j.harvest.out||'').split('\n').map(s=>s.trim()).find(s=>/^新增 /.test(s)):null;
    return {title:T('web.scan.materialized'),detail:T('web.scan.materializedDetail',{line:line||T('web.scan.doneWord')})};
  });
}
document.getElementById('materialize').onclick=e=>materialize(e.currentTarget);

(async()=>{
  try{
    const r=await api('overview');
    if(r.error)throw new Error(r.error);
    D=r;chips();vFind();
  }catch(e){
    const msg=MISSING
      ?'此页面需要通过本地服务打开：运行 ai-memlint view · This page must be opened through the local server: run ai-memlint view'
      :T('web.err.overview',{err:e.message});
    document.getElementById('v-find').append(el('div','banner b',msg));
  }
})();
</script>
